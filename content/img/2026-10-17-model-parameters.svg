  </g>
  <text x="72" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#2b2b2b">70B</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#2b2b2b">
    <text x="136" y="47">= 70 billion numbers,</text><text x="136" y="65">each learned in training</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#2b2b2b" text-anchor="middle">
