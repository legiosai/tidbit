    <rect x="24" y="24" width="96" height="52" rx="10" fill="#ffd166"/>
    <rect x="24" y="92" width="352" height="74" rx="10" fill="#e6dfd0"/>
    <rect x="40" y="182" width="150" height="28" rx="14" fill="#f4a7a7"/>
