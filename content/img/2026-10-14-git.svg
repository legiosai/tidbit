<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
  <rect width="400" height="240" rx="16" fill="#f3efe6"/>
  <g stroke="#2b2b2b" stroke-width="2" fill="none">
    <line x1="50" y1="150" x2="350" y2="150"/>
    <path d="M110 150 C140 150 140 90 170 90 H230 C260 90 260 150 290 150"/>
  </g>
  <g stroke="#2b2b2b" stroke-width="2">
    <circle cx="50" cy="150" r="11" fill="#9ac7ea"/>
    <circle cx="110" cy="150" r="11" fill="#9ac7ea"/>
    <circle cx="200" cy="150" r="11" fill="#9ac7ea"/>
    <circle cx="290" cy="150" r="11" fill="#9bd1b9"/>
    <circle cx="350" cy="150" r="11" fill="#9ac7ea"/>
    <circle cx="170" cy="90" r="11" fill="#ffd166"/>
    <circle cx="230" cy="90" r="11" fill="#ffd166"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#2b2b2b" text-anchor="middle">
    <text x="80" y="126">main</text>
    <text x="200" y="64">feature branch</text>
    <text x="290" y="180">merge</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#6b6357" text-anchor="middle">
    <text x="50" y="180">"start"</text>
    <text x="110" y="180">"add login"</text>
    <text x="200" y="180">"fix typo"</text>
    <text x="170" y="118">"try new ui"</text>
    <text x="230" y="118">"polish"</text>
  </g>
  <g stroke="#2b2b2b" stroke-width="2" fill="none" stroke-dasharray="4 3">
    <path d="M350 136 V110"/><path d="M346 116 l4 -6 4 6"/>
  </g>
  <text x="350" y="100" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#6b6357">push</text>
  <text x="200" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#2b2b2b">each dot is a commit: a snapshot + a message</text>
  <text x="200" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b6357">branch to try things, merge when ready</text>
</svg>
