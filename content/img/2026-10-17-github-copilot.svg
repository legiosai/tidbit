  <g font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="start">
    <text x="34" y="76" fill="#2b2b2b">def total(prices):</text>
    <text x="50" y="100" fill="#6b6357">sum = 0</text>
    <text x="50" y="122" fill="#6b6357">for p in prices:</text>
    <text x="66" y="144" fill="#6b6357">sum += p</text>
    <text x="50" y="166" fill="#6b6357">return sum</text>
  </g>
