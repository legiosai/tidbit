<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tidbit · tech, explained simply</title>
  <meta name="description" content="Technology concepts explained simply: AI, AWS, networks, security, hardware, software. English and Spanish, no login, open source.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#07080c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="readbar" id="readbar" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="#/" aria-label="tidbit">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="tb-sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb547"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient>
          <linearGradient id="tb-moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cbbdff"/><stop offset="1" stop-color="#9d88f5"/></linearGradient>
          <mask id="tb-bite"><rect width="64" height="64" fill="#fff"/><circle cx="47.5" cy="11" r="11.5" fill="#000"/><circle cx="33.5" cy="10.5" r="5" fill="#000"/></mask>
        </defs>
        <rect x="15" y="5" width="40" height="48" rx="10" fill="url(#tb-moon)" transform="rotate(9 35 29)"/>
        <g transform="rotate(-4 30 36)">
          <rect x="9" y="11" width="42" height="49" rx="11" fill="url(#tb-sun)" mask="url(#tb-bite)"/>
          <path d="M27 22 V42 q0 7.5 7.5 7.5 h4.5 M19.5 31 H40" fill="none" stroke="#170d02" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      <!-- Dotless i's: the dots are drawn in CSS as the sun and the moon. -->
      <span class="brand-name" aria-hidden="true">t<span class="dot-i">ı</span>db<span class="dot-i moon">ı</span>t</span>
    </a>
    <nav class="top-nav">
      <a href="#/" data-i18n="nav.today">Hoy</a>
      <a href="#/all" data-i18n="nav.all">Todas</a>
      <a href="#/learned" data-i18n="nav.learned">Aprendidas</a>
    </nav>
    <div class="top-right">
      <span class="progress" id="progress" title=""></span>
      <button class="lang" id="lang-toggle" type="button" aria-label="Change language"><span data-lang="en">EN</span><span data-lang="es">ES</span></button>
    </div>
  </header>

  <main id="app" class="app">
    <p class="loading" data-i18n="loading">Cargando…</p>
  </main>

  <footer class="foot">
    <p class="foot-in">
      <span data-i18n="foot.made">Hecho por</span>
      <a href="https://github.com/legiosai" rel="noopener">Legios</a>
      · <span data-i18n="foot.progress">Tu progreso queda en este navegador, no hay cuenta ni login.</span>
      · <a href="https://github.com/legiosai/tidbit" rel="noopener" data-i18n="foot.source">Código</a>
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
